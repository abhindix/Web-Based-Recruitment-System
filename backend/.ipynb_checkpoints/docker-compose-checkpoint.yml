version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/recruitment
      JWT_SECRET: "dev_super_secret_change_me"
      # Optional: set to your OpenAI-compatible endpoint/key (LM Studio works)
      LLM_BASE_URL: "http://host.docker.internal:1234/v1"
      LLM_API_KEY: "lm-studio"
      # Example model id - change to whatever LM Studio exposes
      LLM_MODEL: "openai/gpt-oss-20b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

volumes:
  pgdata:
